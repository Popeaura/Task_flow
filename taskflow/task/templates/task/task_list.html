<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>All Tasks</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f6f8fa;
            margin: 0;
            padding: 30px;
        }
        h1 {
            text-align: center;
            color: #333;
        }
        .task-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .task-card {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            cursor: pointer;
            transition: 0.3s;
        }
        .task-card:hover {
            transform: scale(1.03);
        }
        .status {
            font-size: 14px;
            font-weight: bold;
            color: #555;
        }
        .completed {
            color: green;
        }
        .in_progress {
            color: orange;
        }
        .pending {
            color: red;
        }
    </style>
</head>
<body>
    <h1>All Tasks</h1>
    <div class="task-container">
        {% for task in tasks %}
        <div class="task-card" onclick="showDetails('{{ task.title }}', '{{ task.description }}', '{{ task.status }}')">
            <h3>{{ task.title }}</h3>
            <p>{{ task.description|default:"No description provided" }}</p>
            <p class="status {{ task.status|lower|slugify }}">Status: {{ task.get_status_display }}</p>
        </div>
        {% empty %}
        <p style="text-align:center;">No tasks available yet.</p>
        {% endfor %}
    </div>

    <script>
        function showDetails(title, description, status) {
            alert(`Title: ${title}\n\nDescription: ${description}\n\nStatus: ${status}`);
        }
    </script>
</body>
</html>
