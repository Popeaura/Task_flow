<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Task List</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            color: #333;
            margin: 40px;
        }
        h1 {
            color: #2c3e50;
        }
        .task {
            background: #fff;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .status {
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>
<body>
    <h1>All Tasks</h1>

    {% for task in tasks %}
        <div class="task">
            <h3>{{ task.title }}</h3>
            <p>{{ task.description }}</p>
            <p class="status">Status: {{ task.status }}</p>
            <small>Created: {{ task.created_at|date:"Y-m-d H:i" }}</small>
        </div>
    {% empty %}
        <p>No tasks available yet.</p>
    {% endfor %}
</body>
</html>
